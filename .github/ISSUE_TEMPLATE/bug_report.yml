name: Bug report
description: 报告可以复现的功能或数据显示问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及营养数值时，请附原始来源和份量口径。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 126 / Safari 17
  - type: textarea
    id: source
    attributes:
      label: 数据来源（如适用）
      description: 营养数值问题请提供 URL、份量口径和访问日期。
